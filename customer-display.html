<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Layar Nasabah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,800;1,800&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
  :root{
    --primary:#F3A616; --primary-hover:#D6900E; --secondary:#0A1D3C; --secondary-light:#163666;
    --bg:#F8FAFC; --text-main:#0F172A; --text-muted:#64748B; --border:#F1F5F9;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0; height:100%; font-family:'DM Sans',sans-serif; background:#0A1D3C; overflow:hidden;}
  h1,h2,h3{font-family:'Plus Jakarta Sans',sans-serif;}
  #screen{width:100vw; height:100vh; position:relative;}
  .hidden{display:none !important;}

  /* ---------- IDLE (banner promo) ---------- */
  #idle{width:100%; height:100%; position:relative; background:linear-gradient(160deg,#163666,#0A1D3C 70%); display:flex; flex-direction:column; align-items:center; justify-content:center; color:#fff; text-align:center;}
  #idle .orb{position:absolute; border-radius:50%; filter:blur(80px); opacity:.4;}
  #idle-banner{width:min(80vw,900px); aspect-ratio:2/1; border-radius:24px; overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,.4); background:#111; display:none;}
  #idle-banner img{width:100%; height:100%; object-fit:cover; display:block;}
  #idle-dots{display:flex; gap:8px; margin-top:20px; justify-content:center;}
  .wordmark{font-family:'Montserrat',sans-serif; font-weight:800; font-style:italic; letter-spacing:-.5px;}

  /* ---------- SIGNING (syarat + tanda tangan) ---------- */
  #signing{width:100%; height:100%; background:#F8FAFC; display:flex; flex-direction:column;}
  .sign-header{background:linear-gradient(160deg,#163666,#0A1D3C 70%); padding:28px 40px; color:#fff; text-align:center;}
  .sign-body{flex:1; display:flex; gap:30px; padding:30px 50px; overflow:hidden;}
  .terms-box{flex:1; background:#fff; border-radius:20px; padding:28px; overflow-y:auto; box-shadow:0 10px 30px rgba(15,23,42,.06); border:1px solid var(--border); font-size:16px; line-height:1.8; color:var(--text-main); white-space:pre-wrap;}
  .sign-box{flex:1; display:flex; flex-direction:column; gap:16px;}
  .checkbox-row{display:flex; align-items:center; gap:12px; background:#fff; border-radius:16px; padding:18px 20px; border:1.5px solid var(--border); cursor:pointer; font-size:15px; font-weight:600;}
  .checkbox-row input{width:22px; height:22px;}
  canvas{background:#fff; border-radius:16px; border:2px dashed #CBD5E1; touch-action:none; flex:1; width:100%;}
  .sign-actions{display:flex; gap:12px;}
  .btn{border:none; border-radius:999px; padding:16px; font-size:15px; font-weight:700; cursor:pointer; flex:1;}
  .btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-hover)); color:#fff;}
  .btn-primary:disabled{opacity:.4;}
  .btn-outline{background:#fff; border:1.5px solid var(--border); color:var(--text-main);}

  /* ---------- THANK YOU ---------- */
  #thankyou{width:100%; height:100%; background:linear-gradient(160deg,#163666,#0A1D3C 70%); display:flex; flex-direction:column; align-items:center; justify-content:center; color:#fff; text-align:center;}
</style>
</head>
<body>

<div id="screen">
  <div id="idle">
    <div class="orb" style="width:400px; height:400px; background:#F3A616; top:-100px; right:-100px;"></div>
    <div class="orb" style="width:300px; height:300px; background:#163666; bottom:-80px; left:-80px;"></div>
    <div style="position:relative;">
      <div class="wordmark" style="font-size:48px; margin-bottom:8px;">PASTI <span style="color:#F3A616;">PUNYA</span></div>
      <div id="idle-agent-name" style="font-size:16px; opacity:.7; margin-bottom:36px;">—</div>
      <div id="idle-banner"><img id="idle-banner-img" src=""></div>
      <div id="idle-dots"></div>
    </div>
  </div>

  <div id="signing" class="hidden">
    <div class="sign-header">
      <h1 style="margin:0; font-size:26px;">Syarat & Ketentuan Pembukaan Tabungan</h1>
      <p style="margin:8px 0 0; opacity:.7; font-size:14px;">Nasabah: <b id="sign-customer-name">—</b></p>
    </div>
    <div class="sign-body">
      <div class="terms-box" id="terms-text"></div>
      <div class="sign-box">
        <label class="checkbox-row">
          <input type="checkbox" id="chk-setuju" onchange="toggleCanvas()">
          Saya sudah membaca dan menyetujui syarat & ketentuan di atas
        </label>
        <canvas id="sign-canvas"></canvas>
        <div class="sign-actions">
          <button class="btn btn-outline" onclick="clearCanvas()">Hapus & Ulangi</button>
          <button class="btn btn-primary" id="btn-submit-sign" onclick="submitSignature()" disabled>Kirim Tanda Tangan</button>
        </div>
      </div>
    </div>
  </div>

  <div id="thankyou" class="hidden">
    <div class="wordmark" style="font-size:40px; margin-bottom:16px;">✅ Terima Kasih!</div>
    <p style="font-size:18px; opacity:.8;">Tanda tangan Anda sudah tersimpan.</p>
  </div>
</div>

<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBVD_JxRan2imOtcWCxc78_2zHvb1uY_UA",
  authDomain: "buku-tabungan-d91d3.firebaseapp.com",
  projectId: "buku-tabungan-d91d3",
  storageBucket: "buku-tabungan-d91d3.firebasestorage.app",
  messagingSenderId: "259351197970",
  appId: "1:259351197970:web:468eee581958e5f74f1bcb",
  measurementId: "G-KWC8F3N9Z9"
};
firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.firestore();

let banners = [], bannerIndex = 0, bannerTimer = null;
let canvas, ctx, drawing = false, hasSignature = false;

function showScreen(id){
  ['idle','signing','thankyou'].forEach(s=>document.getElementById(s).classList.toggle('hidden', s!==id));
}

/* ---------- IDLE: agent name + banner promo ---------- */
db.collection('agent_settings').doc('main').get().then(doc=>{
  if(doc.exists) document.getElementById('idle-agent-name').textContent = doc.data().name || '';
}).catch(()=>{});

db.collection('promo_banners').where('aktif','==',true).onSnapshot(snap=>{
  banners = snap.docs.map(d=>d.data()).sort((a,b)=>(a.urutan||0)-(b.urutan||0));
  renderIdleBanner();
  if(bannerTimer) clearInterval(bannerTimer);
  if(banners.length>1){
    bannerTimer = setInterval(()=>{ bannerIndex = (bannerIndex+1)%banners.length; renderIdleBanner(); }, 6000);
  }
}, err=>console.error(err));

function renderIdleBanner(){
  const box = document.getElementById('idle-banner');
  const dots = document.getElementById('idle-dots');
  if(!banners.length){ box.style.display='none'; dots.innerHTML=''; return; }
  box.style.display='block';
  document.getElementById('idle-banner-img').src = banners[bannerIndex].imageUrl;
  dots.innerHTML = banners.map((b,i)=>`<div style="width:${i===bannerIndex?24:8}px; height:8px; border-radius:4px; background:${i===bannerIndex?'#F3A616':'rgba(255,255,255,.3)'}; transition:width .3s;"></div>`).join('');
}

/* ---------- SIGNING: dengarkan permintaan dari staff ---------- */
db.collection('signature_sessions').doc('current').onSnapshot(doc=>{
  const d = doc.data();
  if(!d || d.status!=='waiting'){
    if(document.getElementById('signing').classList.contains('hidden')===false && (!d || d.status==='idle')){
      showScreen('idle');
    }
    return;
  }
  document.getElementById('sign-customer-name').textContent = d.customerName || '—';
  document.getElementById('terms-text').textContent = d.termsText || '';
  document.getElementById('chk-setuju').checked = false;
  showScreen('signing');
  setTimeout(initCanvas, 50);
});

/* ---------- Canvas tanda tangan ---------- */
function initCanvas(){
  canvas = document.getElementById('sign-canvas');
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width;
  canvas.height = Math.max(200, rect.height * 0.55);
  ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle = '#0A1D3C';
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  hasSignature = false;
  document.getElementById('btn-submit-sign').disabled = true;

  function pos(e){
    const r = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x: p.clientX - r.left, y: p.clientY - r.top };
  }
  function start(e){ e.preventDefault(); drawing = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); }
  function move(e){ if(!drawing) return; e.preventDefault(); const p = pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); hasSignature = true; updateSubmitState(); }
  function end(){ drawing = false; }

  canvas.onmousedown = start; canvas.onmousemove = move; canvas.onmouseup = end; canvas.onmouseleave = end;
  canvas.ontouchstart = start; canvas.ontouchmove = move; canvas.ontouchend = end;
}
function clearCanvas(){
  if(!ctx) return;
  ctx.fillStyle = '#fff';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  hasSignature = false;
  updateSubmitState();
}
function toggleCanvas(){ updateSubmitState(); }
function updateSubmitState(){
  const setuju = document.getElementById('chk-setuju').checked;
  document.getElementById('btn-submit-sign').disabled = !(setuju && hasSignature);
}
async function submitSignature(){
  const dataUrl = canvas.toDataURL('image/png');
  await db.collection('signature_sessions').doc('current').update({
    status:'signed', signatureDataUrl: dataUrl, respondedAt: new Date().toISOString(),
  });
  showScreen('thankyou');
  setTimeout(()=>{ showScreen('idle'); }, 5000);
}
</script>
</body>
</html>
